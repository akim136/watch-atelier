<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><title>Watch Atelier — hand and material specimens</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#151c21;color:#e9e6dd;font:14px system-ui}main{max-width:1080px;margin:0 auto;padding:24px 28px}header{display:flex;justify-content:space-between;align-items:baseline;gap:20px}h1{font-size:20px;font-weight:500;letter-spacing:.02em;margin:0}p{color:#b3bcbf;line-height:1.5}.controls{display:flex;flex-wrap:wrap;gap:16px;align-items:center;margin:20px 0}label{display:flex;align-items:center;gap:8px}select,button{font:inherit;color:inherit;background:#283338;border:1px solid #66747a;border-radius:4px;padding:7px 10px}select:focus-visible,button:focus-visible{outline:2px solid #dfc78e;outline-offset:3px}canvas{display:block;width:1024px;height:1024px;max-width:100%}#status{min-height:24px;margin-top:12px}#caption{min-height:42px}small{color:#b3bcbf}
</style></head><body><main>
<header><h1>WATCH ATELIER / PART STUDIES</h1><small>Original concept geometry · 01</small></header>
<p>Authoring specimens. These recipe selections are not saved watch controls. Neutral dial support shows hand spacing; no case or movement compatibility is implied.</p>
<div class="controls">
<label>Hand <select id="hand"><option value="pencil">Pencil</option><option value="sword">Sword</option><option value="dauphine">Dauphine</option><option value="spade">Spade</option></select></label>
<label>Finish <select id="finish"><option value="titanium-look">Titanium look</option><option value="champagne-gold-look">Champagne gold look</option><option value="bronze-look">Bronze look</option><option value="ink-ceramic-look">Ink ceramic look</option></select></label>
<label>View <select id="view"><option>Front</option><option>Oblique</option><option>Profile</option><option>Detail</option></select></label>
<button id="materials">Material sheet</button><button id="export">Save specimen PNG</button>
</div>
<div id="caption"></div><canvas width="1024" height="1024" aria-label="Rendered asset specimen"></canvas>
<div id="status" role="status">Preparing local renderer…</div>
</main><script type="module" src="./parts-preview.ts"></script></body></html>
